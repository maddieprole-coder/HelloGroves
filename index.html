<!DOCTYPE html>

<head>

<title>Hello Groves</title>
<style>
:root{--g:#2F5D50;--g2:#e8f0ec;--ink:#1d1d1b;--mut:#666;--line:#d9d9d4;--warn:#b24a2b;--bg:#fafaf7}

h2{font-size:17px;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}

button.d{background:none;border:0;color:var(--warn);cursor:pointer;font:inherit;padding:0}
.low{color:var(--warn);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut);font-size:13px}
.ok{color:var(--g);font-weight:bold}
.big{font-size:22px;font-weight:bold;color:var(--g)}

/* minimalist refresh */

.big{font-weight:600}
.row{gap:10px}

@media (max-width:640px){
  header{flex-direction:column;align-items:stretch;padding:12px 14px;gap:8px}
  nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav button{flex:0 0 auto;margin-left:0;padding:6px 11px}
  #status{font-size:12px}

}
/* section headings */
tr.sec td{border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:18px 8px 6px;font-weight:600}
/* aesthetic pass */
:root{--bg:#f7f5f0;--g:#3f6b5a;--ink:#23231f;--mut:#8a867c;--line:#e7e3d9;--sage:#7d9a86}

/* Hello Groves branding */
header{padding:14px 28px}
header h1{display:flex;align-items:center;gap:12px;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:400;letter-spacing:.01em}
.mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;font-family:Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}

/* Hello Groves bold pass */
body{background:#f6efe1}
header{background:#2f5d50;box-shadow:none;border-bottom:0;padding:24px 28px}
header h1{gap:14px}

</style>
</head>
<body>
<header>
  <h1><span class="mark">HG</span><span class="word">Hello Groves</span><span class="tag">dinners for four, sorted</span></h1>
  <nav>
    <button data-tab="stock" class="on">Stock</button>
    <button data-tab="house">Household</button>
    <button data-tab="recipes">Recipes</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="shop">Shopping list</button>
    <button data-tab="budget">Budget</button>
  </nav>
  <div class="note" id="status" style="color:#fff;opacity:.85">Loading…</div>
</header>
<main><div id="view"></div></main>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const uid0=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp=n=>"£"+(Number(n)||0).toFixed(2);
const norm=s=>String(s??"").trim().toLowerCase();
const val=id=>document.getElementById(id).value;
const stepFor=unit=>/^(g|ml)$/i.test(unit)?100:1;

const SEED={
  stock:[
    {id:uid0(),name:"Olive oil",qty:1,unit:"bottle",low:1},
    {id:uid0(),name:"Rice",qty:500,unit:"g",low:250},
    {id:uid0(),name:"Tinned tomatoes",qty:2,unit:"tin",low:2},
    {id:uid0(),name:"Peppers",qty:1,unit:"each",low:2}
  ],
  recipes:[
    {id:uid0(),name:"Chicken fajitas",servings:4,cost:14.5,prep:15,cook:20,ingredients:[
      {name:"Chicken thigh",qty:600,unit:"g"},{name:"Peppers",qty:3,unit:"each"},
      {name:"Onion",qty:1,unit:"each"},{name:"Tortillas",qty:8,unit:"each"}]},
    {id:uid0(),name:"Lentil dhal",servings:4,cost:6.2,prep:10,cook:30,ingredients:[
      {name:"Red lentils",qty:250,unit:"g"},{name:"Tinned tomatoes",qty:1,unit:"tin"},
      {name:"Rice",qty:300,unit:"g"},{name:"Spinach",qty:200,unit:"g"}]}
  ],
  plan:{},
  box:{cost:68,people:4,meals:5},
  target:{low:40,high:50},
  discount:10
};

let S=JSON.parse(JSON.stringify(SEED));
let tab="stock", ref=null, timer=null, status="Loading…";

async function connect(){
  try{
    const db=window.claude?await window.claude.use("db"):null;
    const user=window.claude?await window.claude.use("user"):null;
    if(db&&user){ const id=await user.id(); ref=db.doc("data/users/"+id+"/kitchen"); }
  }catch(e){ ref=null; }
  if(ref){
    try{
      const snap=await ref.get();
      const d=snap&&(typeof snap.data==="function"?snap.data():snap.data);
      if(d&&d.stock){ S=JSON.parse(JSON.stringify(d)); status="Saved to your account"; }
      else { await ref.set(S); status="Saved to your account"; }
    }catch(e){ ref=null; }
  }
  if(!ref){
    try{ const raw=localStorage.getItem("kitchen"); if(raw) S=JSON.parse(raw); }catch(e){}
    status="Saved in this browser only";
  }
  render();
  addMissingStarters();
  render();
}

const INITIAL_STOCK=[["dried thyme",1,"tsp"],["dried oregano",1,"tsp"],["dried rosemary",0.75,"g"],["5 spice mix",1,"tsp"],["smoked paprika",2,"tsp"],["cinnamon",0.5,"g"],["cornflour",4,"tbsp"],["caribbean jerk seasoning",5,"g"],["thai style spice mix",14,"g"],["indonesian style spice mix",3.5,"g"],["breadcrumbs",75,"g"],["sriracha",15,"ml"],["apple cider vinegar",30,"ml"],["red wine vinegar",24,"ml"],["white wine vinegar",15,"ml"],["balsamic glaze",24,"g"],["sesame oil",40,"ml"],["chinese rice wine",30,"ml"],["ketjap manis",20,"g"],["soy sauce",10,"ml"],["guinness smoky bbq sauce",1,"each"],["tomato puree",30,"g"],["ginger puree",1,"each"],["miso paste",15,"g"],["vegetable stock paste",15,"g"],["red chilli relish",25,"g"],["honey",60,"g"],["chicken stock cube",12,"each"],["beef stock cube",12,"each"]];
const INITIAL_STOCK2=[["chicken seasoning",3,"each"],["jerk seasoning",1,"each"],["green seasoning",1,"each"],["all purpose seasoning",100,"g"],["garlic granules",2,"each"],["fajita seasoning",1,"each"],["salt and pepper seasoning",1,"each"],["paprika",1,"each"],["dried thyme",1,"each"],["italian seasoning",1,"each"],["rosemary",3,"each"],["herbes de provence",1,"each"],["chilli and garlic seasoning",1,"each"],["mixed spice",1,"each"],["ground cinnamon",1,"each"],["pink himalayan salt",1,"each"],["bicarbonate of soda",1,"each"],["sweetcorn",1,"tin"],["hot honey",1,"each"]];
function seedBatch2(){
  if(S.pantrySeeded2) return;
  S.stock=S.stock||[];
  INITIAL_STOCK2.forEach(([name,qty,unit])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,qty,unit,low:0});
  });
  S.pantrySeeded2=true;
}
const INITIAL_STOCK3=[["crispy onions",30,"g"]];
function seedBatch3(){
  if(S.pantrySeeded3) return;
  S.stock=S.stock||[];
  INITIAL_STOCK3.forEach(([name,qty,unit])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,qty,unit,low:0});
  });
  S.pantrySeeded3=true;
}
const INITIAL_STOCK4=[["beef and pork mince",750,"g"],["chicken thighs",650,"g"],["lamb mince",500,"g"],["sausage meat",450,"g"],["beef mince",500,"g"]];
function seedBatch4(){
  if(S.pantrySeeded4) return;
  S.stock=S.stock||[];
  INITIAL_STOCK4.forEach(([name,qty,unit])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,qty,unit,low:0});
  });
  S.pantrySeeded4=true;
}
function fixLambMince(){
  if(S.lambFixed) return;
  const s=(S.stock||[]).find(x=>normN(x.name)==="lamb mince");
  if(s) s.qty=500;
  S.lambFixed=true;
}
const WEEKLY5=[["unsmoked back bacon","pack",1,"Breakfast (weekend)"],["black pudding","each",1,"Breakfast (weekend)"]];
function seedBatch5(){
  if(S.pantrySeeded5) return;
  S.stock=S.stock||[];
  WEEKLY5.forEach(([name,unit,need,cat])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,unit,qty:0,low:0,cat,need});
  });
  S.pantrySeeded5=true;
}
const WEEKLY6=[["cereal","bag",1],["porridge oats","g",400],["greek yoghurt","tub",1],["chocolate chips","g",200],["banana","each",5]];
function seedBatch6(){
  if(S.pantrySeeded6) return;
  S.stock=S.stock||[];
  WEEKLY6.forEach(([name,unit,need])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,unit,qty:0,low:0,cat:"Breakfast (weekday)",need});
  });
  S.pantrySeeded6=true;
}
function fixWeekly2(){
  if(S.weeklyFixed2) return;
  S.stock=S.stock||[];
  const set=(name,patch)=>{ const s=S.stock.find(x=>normN(x.name)===name); if(s) Object.assign(s,patch); };
  set("cereal",{unit:"bag",qty:1,need:1});
  set("greek yoghurt",{unit:"tub",qty:1,need:1});
  set("porridge oats",{qty:1000,need:400});
  if(!S.stock.some(x=>normN(x.name)==="uht milk")) S.stock.push({id:uid0(),name:"UHT milk",unit:"box",qty:2,low:0,cat:"Household",need:0});
  S.weeklyFixed2=true;
}
const WEEKLY7=[["pop","can",28]];
function seedBatch7(){
  if(S.pantrySeeded7) return;
  S.stock=S.stock||[];
  WEEKLY7.forEach(([name,unit,need])=>{
    if(!S.stock.some(s=>normN(s.name)===normN(name)&&normU(s.unit)===normU(unit))) S.stock.push({id:uid0(),name,unit,qty:0,low:0,cat:"Drinks",need});
  });
  S.pantrySeeded7=true;
}
function fixNuggets(){
  if(S.nuggetsFixed) return;
  const r=(S.recipes||[]).find(x=>normN(x.name)==="chicken nuggets and chips");
  if(r){ r.ingredients=parseIng("Ready-made chicken nuggets 500 g; frozen chips 750 g"); r.steps=["Heat the air fryer to 200C.","Put the frozen chips in the basket in a single layer and cook for 15 to 18 minutes, shaking halfway.","Add the nuggets on top of the chips, or in a separate basket, and cook for 10 to 12 minutes until piping hot all the way through.","Check the nuggets are steaming in the middle, then serve."]; r.stepsV=2; r.nut="Check nugget and chip labels"; }
  S.nuggetsFixed=true;
}
function fixYoghurt2(){
  if(S.yoghurtFixed2) return;
  const s=(S.stock||[]).find(x=>normN(x.name)==="greek yoghurt");
  if(s) s.need=1000;
  S.yoghurtFixed2=true;
}
function fixChickenLeftover(){
  if(S.chickenLeftover) return;
  S.stock=S.stock||[];
  if(!S.stock.some(s=>normN(s.name)==="chicken breast"&&normU(s.unit)==="g")) S.stock.push({id:uid0(),name:"chicken breast",qty:500,unit:"g",low:0});
  S.chickenLeftover=true;
}
function fixPdfWeek(){
  if(S.pdfWeek) return;
  const R=[
    {name:'Sausage and pepper rigatoni',carb:'Pasta',method:'Hob',min:20,cost:9,nut:'None expected',ing:'Rigatoni 400 g; pork sausages 6 each; bell pepper 2 each; passata 400 g; garlic granules 4 g; mozzarella 125 g',steps:['Fill a large pan with salted water and bring it to the boil.','While the water heats, slice the sausages into chunks and the peppers into strips.','Add the rigatoni to the water and cook for 11 minutes.','While the pasta cooks, fry the sausage for 6 minutes until browned.','Add the peppers and garlic granules for 4 minutes, then the passata.','Simmer for 5 minutes, then drain the rigatoni.','Toss the pasta through the sauce and scatter with torn mozzarella.']},
    {name:'Chicken yakitori rice',carb:'Rice',method:'Hob',min:20,cost:10,nut:'Check yakitori sauce label',ing:'Rice 300 g; chicken thighs 500 g; yakitori sauce 4 tbsp; spring onions 3 each; sesame seeds 1 tbsp',steps:['Rinse the rice and cook it for 12 minutes.','While the rice cooks, cut the chicken into bite-sized pieces and slice the spring onions.','Fry the chicken for 8 minutes until cooked through.','Add the yakitori sauce and cook 2 minutes until sticky.','Fluff the rice and spoon into bowls.','Top with chicken, spring onions and sesame seeds.']},
    {name:'Chilli garlic prawn rice',carb:'Rice',method:'Hob',min:15,cost:11,nut:'None expected',ing:'King prawns 400 g; rice 300 g; red chillies 2 each; garlic granules 6 g; lime 1 each; spring onions 3 each',steps:['Rinse the rice and cook it for 12 minutes.','While the rice cooks, slice the chillies, crush the garlic granules and cut the lime.','Fry the garlic granules and chillies for 1 minute.','Add the prawns and cook 3 minutes until pink.','Fluff the rice and spoon the prawns on top.','Finish with lime and spring onions.']},
    {name:'Crispy chicken and smashed potatoes',carb:'Potato',method:'Air fryer',min:22,cost:9,nut:'None expected',ing:'Chicken breast 500 g; baby potatoes 800 g; oil 2 tbsp; rosemary 1 tsp; garlic granules 4 g',steps:['Boil the baby potatoes for 10 minutes, then drain.','Smash them, toss in oil, rosemary and garlic granules, and air-fry at 200C for 12 minutes.','Air-fry the chicken breast for 12 minutes until cooked through.','Slice the chicken and serve with the potatoes.']},
    {name:'Spicy sausage arrabbiata',carb:'Pasta',method:'Hob',min:20,cost:8,nut:'None expected',ing:'Penne 400 g; pork sausages 6 each; chopped tomatoes 2 tin; chilli flakes 1 tsp; garlic granules 4 g; parmesan 40 g',steps:['Fill a large pan with salted water and bring it to the boil.','While the water heats, slice the sausages and crush the garlic granules.','Add the penne to the water and cook for 10 minutes.','While the pasta cooks, fry the sausage for 6 minutes, breaking it up.','Add the garlic granules, chilli flakes and tomatoes and simmer for 8 minutes.','Drain the penne and toss through the sauce.','Serve with parmesan.']}
  ];
  S.recipes=S.recipes||[];
  const byName=n=>S.recipes.find(y=>normN(y.name)===normN(n));
  R.forEach(x=>{
    let r=byName(x.name);
    if(!r){ r={id:uid0(),name:x.name,servings:4,cost:x.cost,prep:0,cook:x.min,carb:x.carb,method:x.method,nut:x.nut,ingredients:[],steps:[]}; S.recipes.push(r); }
    Object.assign(r,{carb:x.carb,method:x.method,cook:x.min,cost:x.cost,nut:x.nut,ingredients:parseIng(x.ing),steps:x.steps,stepsV:2});
  });
  S.plan=S.plan||{};
  const set=(d,n)=>{ const r=byName(n); if(r&&!(S.plan[d]&&S.plan[d].cooked)) S.plan[d]={recipeId:r.id,cooked:false}; };
  set('Mon','Sausage and pepper rigatoni');

function addMissingStarters(){
  seedPantry();
  try{
    if(!Array.isArray(S.recipes)) S.recipes=[];
    const BANNED=/courgette|zucchini|green bean/i;
    const before=S.recipes.length;
    S.recipes=S.recipes.filter(r=>!BANNED.test(r.name||"")&&!(r.ingredients||[]).some(i=>BANNED.test(i.name||"")));
    const removed=before-S.recipes.length;
    let bf=0;
    S.recipes.forEach(r=>{ if((!r.steps||r.stepsV!==2)&&METHODS[r.name]){ r.steps=METHODS[r.name]; r.stepsV=2; bf++; } });
    Object.keys(S.plan).forEach(d=>{ if(S.plan[d]&&!S.recipes.some(r=>r.id===S.plan[d].recipeId)) delete S.plan[d]; });
    let n=0;
    STARTER.forEach(x=>{
      if(!S.recipes.some(r=>norm(r.name)===norm(x.name))){
        S.recipes.push({...x,id:uid0(),steps:METHODS[x.name]||[],stepsV:2,ingredients:x.ingredients.map(i=>({...i}))}); n++;
      }
    });
    if(n||removed||bf){ status=(n?`Loaded ${n} recipes. `:"")+(removed?`Removed ${removed} with courgette or green beans.`:""); save(); }
    return n;
  }catch(e){
    status="Starter load failed: "+(e&&e.message?e.message:String(e));

    return 0;
  }
}

function purgeSideSalad(){
  const bad=/side salad/i;
  (S.recipes||[]).forEach(r=>{
    r.ingredients=(r.ingredients||[]).filter(i=>!bad.test(i.name));
    if(Array.isArray(r.steps)) r.steps=r.steps.filter(x=>!bad.test(x));
  });
  S.stock=(S.stock||[]).filter(s=>!bad.test(s.name));
}
function normaliseIngredients(){
  const isPep=n=>/pepper/i.test(n)&&!/salt|black|white|chilli|paprika|sichuan|cayenne/i.test(n);
  (S.recipes||[]).forEach(r=>{
    (r.ingredients||[]).forEach(i=>{
      if(isPep(i.name)) i.name="Bell pepper";
      if(/garlic/i.test(i.name)&&!/granule/i.test(i.name)){
        const u=String(i.unit||"").toLowerCase();
        if(u==="clove"||u==="each"||u===""){ i.qty=+((Number(i.qty)||1)*2).toFixed(1); i.unit="g"; }
        i.name="garlic granules";
      }
      if(/granule/i.test(i.name)&&String(i.unit||"").toLowerCase()==="tsp"){ i.qty=+(Number(i.qty)*4).toFixed(1); i.unit="g"; }
    });
    if(Array.isArray(r.steps)) r.steps=r.steps.map(x=>x.replace(/\bgarlic\b(?! granules)/gi,"garlic granules"));
  });
  (S.stock||[]).forEach(s=>{ if(isPep(s.name)) s.name="Bell pepper"; });
  if(!S.granulesFixed){
    (S.stock||[]).forEach(s=>{ if(normN(s.name)==="garlic granules"){ s.unit="tsp"; s.qty=40; } });
    S.granulesFixed=true;
  }
  if(!S.granulesFixed2){
    (S.stock||[]).forEach(s=>{ if(normN(s.name)==="garlic granules"){ s.unit="g"; s.qty=112; } });
    S.granulesFixed2=true;
  }
}
function shopping(){
  purgeSideSalad();
  normaliseIngredients();
  const need={};
  DAYS.forEach(d=>{
    const p=S.plan[d]; if(!p||!p.recipeId||p.cooked) return;
    const r=S.recipes.find(x=>x.id===p.recipeId); if(!r) return;
    r.ingredients.forEach(i=>{
      const k=norm(i.name)+"|"+norm(i.unit);
      need[k]=need[k]||{name:i.name,unit:i.unit,qty:0};
      need[k].qty+=Number(i.qty)||0;
    });
  });
  S.stock.forEach(s=>{
    const lowAt=s.low>0?s.low:(portionFor(s)||s.need||0);
    const back=s.qty<=lowAt?backFor(s):0;
    const add=(Number(s.need)||0)+back; if(!add) return;
    const k=norm(s.name)+"|"+norm(s.unit); need[k]=need[k]||{name:s.name,unit:s.unit,qty:0}; need[k].qty+=add;
  });
  return Object.values(need).map(n=>{
    const have=S.stock.filter(s=>norm(s.name)===norm(n.name)&&norm(s.unit)===norm(n.unit)).reduce((a,s)=>a+s.qty,0);
    return {...n,have,buy:Math.max(0,n.qty-have)};
  }).filter(x=>x.buy>0 && !(S.bought&&S.bought[normN(x.name)+"|"+normU(x.unit)]));
}

function cook(d){
  const p=S.plan[d]; const r=p&&S.recipes.find(x=>x.id===p.recipeId); if(!r) return;
  r.ingredients.forEach(i=>{
    let rem=Number(i.qty)||0;
    S.stock.filter(s=>norm(s.name)===norm(i.name)&&norm(s.unit)===norm(i.unit)).forEach(s=>{
      const t=Math.min(rem,s.qty); s.qty=+(s.qty-t).toFixed(2); rem-=t;
    });
  });
  p.cooked=true;
  S.history=S.history||[];
  S.history.push({date:new Date().toISOString().slice(0,10),recipeId:r.id,name:r.name});
}

    [/banana|apple|clementine|grape|strawberr|blueberr|onion|garlic|pepper|potato|tomato|carrot|leek|cucumber|lettuce|spinach|mushroom|\bpea|broccoli|pak choi|avocado|lime|lemon|chilli|ginger|courgette|salad|coriander|parsley|basil|mint|dill|bunch/,"Fruit & Veg"]
  ];
  const r=rules.find(([re])=>re.test(n));
  return r?r[1]:"Other";
}
function vShop(){
  const conv={tbsp:15,tsp:5};
  const list=shopping();
  const sorted=[...list].sort((a,b)=>SECTIONS.indexOf(sectionFor(a.name))-SECTIONS.indexOf(sectionFor(b.name)));
  let lastSec="";
  const listRows=sorted.map(x=>{
    const sec=sectionFor(x.name);
    const head=sec!==lastSec?`<tr class="sec"><td colspan="7">${sec}</td></tr>`:"";
    lastSec=sec;
    const b=bandFor(x.name,x.buy,x.unit);
    let q=x.buy, u=x.unit;
    if(b){
      if(conv[normU(x.unit)]) q=+(b.packs*b.pack/conv[normU(x.unit)]).toFixed(2);
      else if(normU(b.unitName)===normU(x.unit)) q=b.packs*b.pack;
    }
    const dk=normN(x.name)+"|"+normU(x.unit);
    return head+`<tr class="${S.bought&&S.bought[dk]?'done':''}">
      <td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${x.have} ${esc(x.unit)}</td>
      <td><strong>${x.buy} ${esc(x.unit)}</strong></td><td>${costCell(x)}</td>
      <td><input type="number" step="0.01" min="0" placeholder="£ paid" data-a="actual" data-name="${esc(x.name)}" data-unit="${esc(x.unit)}" data-buy="${x.buy}" style="width:90px"></td>
      <td><button class="s" data-a="shop-bought" data-name="${esc(x.name)}" data-unit="${esc(u)}" data-buy="${q}" data-key="${dk}">Bought</button> <span class="note">adds ${q} ${esc(u)}</span></td></tr>`;
  }).join("");
  return `<div class="card shop"><h2>Shopping list <button class="s" data-a="shop-all">Already shopped: add whole list to stock</button></h2>
    <table><thead><tr><th>Item</th><th>Needed</th><th>In stock</th><th>To buy</th><th>Est. cost (shelf price)</th><th>Actual paid (£)</th><th></th></tr></thead>
    <tbody>${listRows||'<tr><td colspan="7" class="muted">Nothing to buy. Your stock covers the plan, or no dinners are planned.</td></tr>'}</tbody></table>
    <p class="row"><strong>Estimated shop: ${totalBand(list.filter(x=>x.buy>0))}</strong></p><p class="note">“Bought” adds the whole pack to stock, so anything left over stays in stock for later meals. Anything marked low is topped up to one spare pack. Prices are rough Tesco-style estimates, not live shelf prices. Type what you paid in Actual paid (for the whole line) and future estimates for that item use your price. Items with no price show as pantry or not priced.</p></div>`;
}

function vBudget(){
  const meals=Math.max(1,Number(S.box.meals)||1);
  const people=Math.max(1,Number(S.box.people)||1);
  const boxPerDinner=S.box.cost/meals;
  const boxPerServing=S.box.cost/(meals*people);
  const tLow=S.target.low/meals, tHigh=S.target.high/meals;
  const planned=DAYS.map(d=>{const p=S.plan[d]; return S.recipes.find(x=>x.id===p?.recipeId);}).filter(Boolean);
  const count=planned.length;
  const disc=0;
  const total=planned.reduce((a,r)=>a+r.cost,0)*(1-disc);
  const avg=count?total/count:0;
  const projected=avg*meals;
  let verdict;
  if(!count) verdict="Plan some dinners on the Plan tab to compare.";
  else if(avg<=tHigh) verdict=`<span class="ok">Within target: ${gbp(avg)} per dinner against ${gbp(tHigh)} at most.</span>`;
  else verdict=`<span class="low">Over target by ${gbp(avg-tHigh)} per dinner.</span>`;
  return `<div class="card"><h2>Your box</h2>
    <div class="row">Box price £<input type="number" step="0.01" data-f="box.cost" value="${S.box.cost}" style="width:100px">
      for <input type="number" min="1" data-f="box.meals" value="${S.box.meals}" style="width:70px"> dinners,
      <input type="number" min="1" data-f="box.people" value="${S.box.people}" style="width:70px"> people</div>
    <div class="row" style="margin-top:10px">Shelf prices, no discount applied</div>
    <div class="row" style="margin-top:10px">Target for the week: £<input type="number" step="0.01" data-f="target.low" value="${S.target.low}" style="width:90px">
      to £<input type="number" step="0.01" data-f="target.high" value="${S.target.high}" style="width:90px"></div>
  </div>
  <div class="grid">
    <div class="card"><div class="muted">Box now, per dinner</div><div class="big">${gbp(boxPerDinner)}</div><div class="note">${gbp(boxPerServing)} per serving</div></div>
    <div class="card"><div class="muted">Target, per dinner</div><div class="big">${gbp(tLow)} to ${gbp(tHigh)}</div><div class="note">${gbp(S.target.low)} to ${gbp(S.target.high)} for ${meals} dinners</div></div>
    <div class="card"><div class="muted">Your plan, per dinner</div><div class="big">${count?gbp(avg):'—'}</div><div class="note">${count} dinner${count===1?'':'s'} planned</div></div>
    <div class="card"><div class="muted">Projected ${meals}-dinner week</div><div class="big">${count?gbp(projected):'—'}</div><div class="note">${count?gbp(S.box.cost-projected)+' less than the box':''}</div></div>
  </div>
  <div class="card">${verdict}</div>`;
}

const METHODS={};
METHODS["Sausage and spinach orecchiette"]=["Boil the orecchiette in salted water for 10 minutes. Keep a cup of the cooking water.","Snip the sausages out of their skins and fry for 6 minutes, breaking them up, until browned.","Add the garlic and chilli flakes for 1 minute, then the spinach until wilted.","Drain the pasta into the pan with the parmesan and a splash of water. Toss and serve."];
METHODS["Bacon, pea and cream fusilli"]=["Boil the fusilli for 10 minutes, adding the peas for the last 2 minutes.","Fry the bacon in a dry pan for about 5 minutes until crisp.","Pour in the cream and simmer for 2 minutes. Stir in the parmesan.","Drain the pasta and peas, toss through the sauce and serve."];
METHODS["Garlic chilli prawn linguine"]=["Cook the linguine in salted water for 9 minutes, then drain.","Fry the sliced garlic and chilli in oil for 1 minute.","Add the prawns and cook 2 to 3 minutes until pink.","Toss the linguine through with lemon zest and juice."];
METHODS["Quick beef ragu tagliatelle"]=["Brown the beef mince in a hot pan for 5 minutes, breaking it up.","Add the onion and carrot and cook 5 minutes until soft.","Stir in the purée and crumbled stock cube, then the tomatoes. Simmer 12 minutes.","Cook the tagliatelle for 8 minutes, drain and toss with the ragu."];
METHODS["Smoked salmon and dill linguine"]=["Pan-fry the salmon fillets 4 minutes each side, then flake.","Boil the fusilli for 10 minutes and drain, keeping a little water.","Warm the crème fraîche and lemon zest in the pan on low heat.","Toss the pasta, salmon and chopped dill through the sauce."];
METHODS["Cajun chicken penne"]=["Cook the penne for 10 minutes and drain.","Season the sliced chicken with Cajun spice and fry 6 minutes until cooked.","Add the peppers and garlic for 3 minutes, then the cream and simmer 3 minutes.","Toss the penne through the sauce and serve."];
METHODS["Pepperoni and mozzarella rigatoni"]=["Cook the rigatoni for 11 minutes and drain.","Fry the pepperoni for 2 minutes until its oil releases.","Add the garlic and tomatoes and simmer 5 minutes.","Stir in the torn mozzarella until melted, then toss with the pasta."];
METHODS["Chicken tikka penne"]=["Cook the penne for 10 minutes and drain.","Fry the chicken with the tikka paste for 6 minutes, then add the onion for 3 minutes.","Stir in the yoghurt, then the spinach until wilted.","Toss the pasta through and serve."];
METHODS["Ham and leek carbonara"]=["Cook the spaghetti for 10 minutes. Reserve a cup of water.","Fry the sliced leek and ham in a little butter for 5 minutes.","Whisk the eggs with the parmesan and pour over the hot pasta off the heat, adding water to loosen.","Stir in the ham and leek and serve straight away."];
METHODS["Cheeseburger macaroni"]=["Cook the macaroni for 8 minutes and drain.","Brown the beef mince with the onion for 6 minutes.","Stir in the passata and simmer 5 minutes, then melt in the cheddar.","Toss with the macaroni and top with chopped gherkins."];
METHODS["Tuna and sweetcorn fusilli"]=["Cook the fusilli for 10 minutes and drain.","Fry the garlic for 1 minute, then add the tomatoes and simmer 5 minutes.","Stir in the drained tuna and sweetcorn for 2 minutes.","Toss with the pasta and finish with lemon juice."];
METHODS["Chorizo and chickpea pasta"]=["Cook the pasta for 10 minutes and drain.","Fry the sliced chorizo for 3 minutes until its oil releases.","Add the garlic, chickpeas and tomatoes and simmer 5 minutes.","Stir in the spinach until wilted, then toss with the pasta."];
METHODS["Lemon chicken orzo with feta"]=["Cook the orzo for 10 minutes, then drain.","Fry the chicken thighs for 8 minutes until cooked through.","Add the garlic and lemon zest, then the spinach until wilted.","Toss with the orzo and crumbled feta. Serve with lemon wedges."];
METHODS["Turkey bolognese spaghetti"]=["Brown the turkey mince for 6 minutes, breaking it up.","Add the onion and garlic and cook 4 minutes.","Stir in the tomatoes and purée and simmer 10 minutes.","Cook the spaghetti for 10 minutes, drain and toss with the sauce."];
METHODS["Chicken and bacon alfredo"]=["Cook the fettuccine for 10 minutes. Keep a cup of water.","Fry the chicken and bacon for 8 minutes until golden.","Add the garlic, then the cream and parmesan. Simmer 3 minutes.","Toss the pasta through, loosening with water if needed."];
METHODS["Cajun prawn penne"]=["Cook the penne for 10 minutes and drain.","Fry the prawns with the Cajun spice for 2 minutes.","Add the peppers for 3 minutes, then the cream and simmer 2 minutes.","Toss the penne through and top with sliced spring onions."];
METHODS["Smoked salmon and lemon linguine"]=["Cook the linguine for 9 minutes and drain.","Warm the crème fraîche with lemon zest and juice on low heat.","Tear in the smoked salmon and dill off the heat.","Toss the pasta through the sauce and serve."];
METHODS["Chicken, chorizo and sun-dried tomato fusilli"]=["Cook the fusilli for 10 minutes and drain.","Fry the chicken and sliced chorizo for 8 minutes.","Add the sun-dried tomatoes and cream, simmer 2 minutes, then stir in the spinach.","Toss through the pasta and serve."];
METHODS["Beef stroganoff tagliatelle"]=["Cook the tagliatelle for 8 minutes and drain.","Fry the beef strips in a hot pan for 2 minutes, then set aside.","Fry the onion and mushrooms for 6 minutes, then add the stock cube and mustard.","Stir in the soured cream and beef, then toss with the pasta."];
METHODS["Sausage and pepper rigatoni"]=["Cook the rigatoni for 11 minutes and drain.","Fry the sausages for 6 minutes, breaking them up, then add the sliced peppers.","Add the garlic and passata and simmer 5 minutes.","Toss the pasta through with torn mozzarella."];
METHODS["Chicken Caesar penne"]=["Cook the penne for 10 minutes and drain.","Fry the chicken for 6 minutes until cooked through, then slice.","Toss the penne with the Caesar dressing and shredded lettuce.","Top with the chicken and grated parmesan."];
METHODS["Spicy sausage arrabbiata"]=["Cook the penne for 10 minutes and drain.","Fry the sausages for 6 minutes, breaking them up.","Add the garlic, chilli flakes and tomatoes and simmer 8 minutes.","Toss through the penne and top with parmesan."];
METHODS["Prawn and pesto penne"]=["Cook the penne for 10 minutes and drain.","Fry the prawns for 2 to 3 minutes until pink.","Halve the cherry tomatoes and wilt the spinach in a pan for 2 minutes.","Toss the penne with the pesto, prawns, tomatoes and spinach."];
METHODS["Beef chilli macaroni"]=["Cook the macaroni for 8 minutes and drain.","Brown the beef mince with the onion for 6 minutes.","Add the chilli powder, tomatoes and kidney beans and simmer 10 minutes.","Toss through the macaroni and melt in the cheddar."];
METHODS["Garlic mushroom and steak gnocchi"]=["Fry the gnocchi in butter for 6 minutes until golden, then set aside.","Sear the sliced steak for 2 minutes, rest, and add the mushrooms for 4 minutes.","Add the garlic for 1 minute, then return the gnocchi and steak.","Scatter with chopped parsley and serve."];
METHODS["Sausage and bean penne"]=["Cook the penne for 10 minutes and drain.","Fry the sausages for 6 minutes, breaking them up, with the onion.","Add the tomatoes, beans and herbs and simmer 6 minutes.","Toss through the penne and serve."];
METHODS["Chicken and sun-dried tomato gnocchi"]=["Fry the gnocchi in a little oil for 5 minutes until golden.","Fry the chicken for 6 minutes, then add the sun-dried tomatoes.","Stir in the cream and parmesan, then the spinach until wilted.","Toss the gnocchi through the sauce and serve."];
METHODS["Beef bolognese with penne"]=["Brown the beef mince for 6 minutes with the garlic.","Add the passata and simmer for 10 minutes.","Cook the penne for 10 minutes and drain.","Toss the penne through the sauce and top with parmesan."];
METHODS["Chicken and mushroom tagliatelle"]=["Cook the tagliatelle for 8 minutes and drain.","Fry the chicken for 6 minutes, then add the mushrooms and garlic for 4 minutes.","Pour in the cream and parmesan and simmer 2 minutes.","Toss the pasta through and serve."];
METHODS["Pizza night"]=["Heat the air fryer to 200C.","Cook the pizzas for 8 to 10 minutes until bubbling.","Toss the salad and serve with the garlic dip."];
METHODS["Chicken fried rice"]=["Cook the rice in boiling water for 12 minutes, then cool it on a tray.","Fry the chicken in a hot wok for 6 minutes. Push to the side and scramble the eggs.","Add the rice, peas and soy sauce and stir-fry 4 minutes.","Finish with sliced spring onions."];
METHODS["Chicken katsu bites with rice"]=["Cook the rice for 12 minutes.","Cut the chicken into bites, coat in flour, beaten egg and panko.","Air-fry at 200C for 12 minutes, turning halfway, until crisp and cooked.","Serve on the rice with katsu sauce."];
METHODS["Beef and broccoli rice stir-fry"]=["Cook the rice for 12 minutes.","Slice the beef and toss with cornflour. Stir-fry in a hot pan for 3 minutes, then set aside.","Stir-fry the broccoli and garlic for 3 minutes, add the sauces and beef.","Serve on the rice."];
METHODS["Sweet chilli salmon with rice"]=["Cook the rice for 12 minutes.","Brush the salmon with sweet chilli sauce and air-fry at 200C for 8 minutes.","Fluff the rice with lime juice.","Serve the salmon on the rice with spring onions."];
METHODS["Chorizo and prawn rice"]=["Fry the chorizo for 3 minutes, then add the pepper and paprika.","Stir in the rice and stock. Simmer covered for 15 minutes.","Add the prawns and peas for the last 4 minutes until pink.","Rest 2 minutes before serving."];
METHODS["Jerk chicken and black bean rice"]=["Rub the chicken thighs with jerk seasoning.","Air-fry at 200C for 18 minutes, turning once, until cooked through.","Cook the rice for 12 minutes and warm the beans.","Serve the chicken on the rice and beans with lime wedges."];
METHODS["Beef burrito bowls"]=["Cook the rice for 12 minutes.","Brown the beef mince for 6 minutes with the taco seasoning and a splash of water.","Warm the beans and sweetcorn through.","Build bowls with rice, beef, beans, salsa and cheese."];
METHODS["Korean chicken rice bowls"]=["Cook the rice for 12 minutes.","Mix the gochujang, soy and honey. Coat the chicken and fry 8 minutes.","Slice the cucumber and spring onions.","Build bowls with rice, chicken and vegetables."];
METHODS["Greek lemon chicken and rice"]=["Cook the rice for 12 minutes.","Fry the chicken with lemon zest and oregano for 8 minutes until cooked.","Chop the cucumber and tomatoes and crumble the feta.","Serve the chicken on the rice with the salad and feta."];
METHODS["Sweet and sour pork rice"]=["Cook the rice for 12 minutes.","Fry the pork in cornflour for 6 minutes until crisp.","Add the peppers and pineapple for 3 minutes, then the sweet and sour sauce.","Serve over the rice."];
METHODS["Cajun salmon and rice"]=["Cook the rice for 12 minutes.","Rub the salmon with Cajun seasoning and air-fry at 200C for 8 minutes.","Fluff the rice with lime juice and chopped red onion.","Serve the salmon on the rice."];
METHODS["Chicken biryani-style rice"]=["Mix the chicken with the biryani paste and yoghurt for 5 minutes.","Fry the chicken and onion for 8 minutes.","Stir in the rice with 350 ml water and the peas. Simmer covered 15 minutes.","Rest 5 minutes, then fluff and serve."];
METHODS["Teriyaki beef rice bowls"]=["Cook the rice for 12 minutes.","Stir-fry the beef in a hot pan for 3 minutes, then add the teriyaki sauce.","Wilt the pak choi for 2 minutes.","Build bowls and top with spring onions."];
METHODS["Turkey and sweetcorn chilli rice"]=["Cook the rice for 12 minutes.","Brown the turkey mince for 6 minutes with the chilli powder.","Add the tomatoes, beans and sweetcorn and simmer 8 minutes.","Serve over the rice."];
METHODS["Ham fried rice"]=["Cook the rice for 12 minutes and cool it.","Scramble the eggs in a hot pan, then add the ham and peas for 3 minutes.","Add the rice and soy sauce and stir-fry 4 minutes.","Serve hot."];
METHODS["Chicken yakitori rice"]=["Cook the rice for 12 minutes.","Fry the chicken for 8 minutes, then add the yakitori sauce and cook 2 minutes.","Slice the spring onions.","Serve the chicken over the rice, sprinkled with sesame seeds and onions."];
METHODS["Prawn and coconut curry rice"]=["Cook the rice for 12 minutes.","Fry the curry paste for 1 minute, then add the coconut milk and simmer 5 minutes.","Add the prawns for 3 minutes until pink, then the spinach until wilted.","Serve with the rice and lime wedges."];
METHODS["Sausage and pea rice pilaf"]=["Fry the sausages for 6 minutes, breaking them up, with the onion.","Stir in the rice, stock and herbs. Simmer covered 15 minutes.","Add the peas for the last 3 minutes.","Fluff and serve."];
METHODS["Chicken and chorizo rice"]=["Fry the chorizo for 3 minutes, then the chicken for 6 minutes.","Add the peppers, rice, stock and paprika.","Simmer covered for 15 minutes until the rice is tender.","Rest 2 minutes and serve."];
METHODS["Chicken and mushroom risotto"]=["Fry the chicken for 6 minutes, then set aside.","Fry the onion and mushrooms for 5 minutes, then add the rice and toast 1 minute.","Add the stock a ladle at a time, stirring, for 18 minutes until creamy.","Stir in the chicken, butter and parmesan. Serve."];
METHODS["Lemon and pea rice with cod"]=["Cook the rice for 12 minutes, adding the peas for the last 2.","Air-fry the cod at 190C for 10 minutes until flaky.","Stir the lemon zest, butter and dill into the rice.","Serve the cod on the rice."];
METHODS["Lamb rice bowls with cucumber yoghurt"]=["Cook the rice for 12 minutes.","Fry the lamb mince with cumin for 8 minutes until browned.","Mix the yoghurt with diced cucumber and chopped mint.","Build bowls with rice, lamb and the yoghurt."];
METHODS["Chicken and pepper rice"]=["Fry the chicken for 6 minutes.","Add the peppers and paprika for 4 minutes.","Stir in the rice and stock, then simmer covered 15 minutes.","Fluff and serve."];
METHODS["Chilli garlic prawn rice"]=["Cook the rice for 12 minutes.","Fry the garlic and chillies for 1 minute.","Add the prawns for 3 minutes until pink.","Serve over the rice with lime and spring onions."];
METHODS["Thai red chicken rice"]=["Cook the rice for 12 minutes.","Fry the curry paste for 1 minute, then the chicken for 6 minutes.","Add the coconut milk and simmer 5 minutes, then the spinach.","Serve on the rice with lime."];
METHODS["Sausage and egg fried rice"]=["Cook the rice for 12 minutes and cool it.","Fry the sausages for 6 minutes, breaking them up, then add the peas.","Push aside, scramble the eggs, then add the rice and soy sauce.","Stir-fry 4 minutes and serve."];
METHODS["Chicken and leek rice bowls"]=["Cook the rice for 12 minutes.","Fry the chicken for 6 minutes, then add the sliced leeks for 4 minutes.","Stir in the stock, cream and thyme, and simmer 3 minutes.","Serve over the rice."];
METHODS["Lemon garlic prawn bowls"]=["Cook the rice for 12 minutes.","Fry the garlic in butter for 1 minute, then the prawns for 3 minutes.","Add the spinach and lemon juice until wilted.","Serve over the rice."];
METHODS["Ham and pea risotto-style rice"]=["Fry the onion for 4 minutes, then add the rice and toast 1 minute.","Add the stock a ladle at a time for 15 minutes, stirring.","Stir in the ham, peas and parmesan.","Rest 2 minutes and serve."];
METHODS["Lemon and garlic chicken with rice"]=["Cook the rice for 12 minutes.","Fry the chicken for 8 minutes with the garlic and lemon.","Wilt the spinach in the pan for 1 minute.","Serve the chicken and spinach on the rice."];
METHODS["Chicken parm bites with wedges"]=["Cut the potatoes into wedges and air-fry at 200C for 15 minutes.","Coat the chicken in beaten egg, then panko. Air-fry 10 minutes until cooked.","Top each bite with passata and mozzarella and air-fry 2 minutes to melt.","Serve with the wedges."];
METHODS["Chicken and potato curry"]=["Boil the potatoes in chunks for 8 minutes until nearly tender.","Fry the onion and curry paste for 4 minutes, then add the chicken for 6 minutes.","Add the potatoes, coconut milk and spinach and simmer 10 minutes.","Serve hot."];
METHODS["Chicken and garlic crispy potatoes"]=["Halve the baby potatoes and toss with oil, garlic powder and paprika.","Air-fry the potatoes at 200C for 12 minutes, shaking halfway.","Add the chicken thighs and cook 12 minutes more until cooked through.","Serve straight from the basket."];
METHODS["Chicken katsu wedges"]=["Cut the potatoes into wedges and air-fry at 200C for 15 minutes.","Coat the chicken in flour, egg and panko, then air-fry 10 minutes.","Slice the chicken and serve with the wedges and katsu sauce."];
METHODS["Crispy cod and chips (air fryer)"]=["Cut the potatoes into chips and air-fry at 200C for 15 minutes.","Dip the cod in flour, beaten egg and breadcrumbs.","Air-fry the cod at 200C for 10 minutes until golden and flaky.","Serve with the chips and tartare sauce."];
METHODS["Sausage and pepper hash"]=["Boil the potatoes in cubes for 6 minutes, then drain.","Fry the sausages for 6 minutes, then add the onion and peppers for 6 minutes.","Add the potatoes and paprika and fry until crisp, about 5 minutes.","Make four gaps, crack in eggs and cover until set."];
METHODS["Bacon and potato hash with eggs"]=["Boil the potatoes in cubes for 6 minutes, then drain.","Fry the bacon for 5 minutes, then add the onion and potatoes for 10 minutes.","Make four gaps, crack in eggs and cover until set, about 4 minutes.","Scatter with grated cheddar and serve."];
METHODS["Steak and chips (air fryer)"]=["Cut the potatoes into chips, toss with rapeseed oil, and air-fry at 200C for 15 minutes.","Rub the steaks with oil and season well.","Air-fry the steaks for 8 minutes, turning once, then rest 3 minutes.","Serve with chips and a spoon of garlic butter on the steak."];
METHODS["Crispy chicken and smashed potatoes"]=["Boil the baby potatoes for 10 minutes, then drain.","Smash them, toss in oil, rosemary and garlic, and air-fry at 200C for 12 minutes.","Air-fry the chicken breast for 12 minutes until cooked through.","Slice the chicken and serve with the potatoes."];
METHODS["Pork schnitzel with mash"]=["Boil the potatoes for 12 minutes, then mash with butter and milk.","Flatten the pork, dip in flour, egg and panko.","Fry the pork for 3 minutes each side until golden and cooked.","Serve the schnitzel with the mash."];
METHODS["Ham and cheese rosti"]=["Grate the potatoes and squeeze out the water.","Mix with egg, butter and seasoning, then press into a hot pan.","Cook 8 minutes until golden, then flip.","Top with ham and cheddar, cover and cook 5 minutes more."];
METHODS["Chilli stuffed jacket potatoes"]=["Prick the potatoes and air-fry at 200C for 20 minutes until soft.","Brown the beef mince for 6 minutes, then add the beans, tomatoes and chilli powder for 8 minutes.","Split the potatoes and spoon in the chilli.","Top with grated cheddar."];
METHODS["Honey mustard salmon with new potatoes"]=["Halve the baby potatoes and air-fry at 200C for 12 minutes.","Mix the mustard, honey and oil and brush over the salmon.","Add the salmon to the basket and cook 8 minutes until flaky.","Serve the salmon with the potatoes."];
METHODS["Chicken chorizo potato hash"]=["Boil the potatoes in cubes for 6 minutes, then drain.","Fry the chicken and chorizo for 8 minutes.","Add the potatoes and peppers and fry until crisp, about 8 minutes.","Serve hot."];
METHODS["Beef meatballs and mash"]=["Boil the potatoes for 12 minutes, then mash with butter and milk.","Mix the beef mince, breadcrumbs and egg, and roll into balls.","Fry the meatballs for 10 minutes, turning, until cooked.","Make a quick gravy with the stock cube and serve over the mash."];
METHODS["Sausage and red onion air-fried potatoes"]=["Halve the potatoes and toss with oil and mustard.","Air-fry the potatoes at 200C for 10 minutes, shaking halfway.","Add the sausages and sliced red onion and cook 12 minutes more.","Serve hot."];
METHODS["Prawn and potato tortilla"]=["Boil the potatoes in cubes for 6 minutes, then drain.","Fry the potatoes for 6 minutes, then add the garlic and prawns for 3 minutes.","Beat the eggs and pour over, then cook covered for 6 minutes.","Flip or finish under the grill and serve in wedges."];
METHODS["Chicken and bacon potato cakes"]=["Grate the potatoes and squeeze out the water.","Mix with the chicken mince, chopped bacon, egg and flour.","Shape into cakes and fry 4 minutes each side until golden and cooked.","Serve hot."];
METHODS["Turkey burgers with fries (air fryer)"]=["Cut the potatoes into fries and air-fry at 200C for 15 minutes.","Shape the turkey mince with the burger seasoning into patties.","Air-fry the patties 10 minutes, topping with cheese for the last minute.","Serve in a bun or with the fries."];
METHODS["Sausage, egg and bean fry-up"]=["Boil the potatoes in cubes for 6 minutes, then fry until golden.","Fry the sausages and bacon for 8 minutes.","Warm the beans in a pan for 3 minutes.","Fry the eggs and serve everything together."];
METHODS["Steak and mushroom mash"]=["Boil the potatoes for 12 minutes, then mash with butter and milk.","Sear the steaks 2 to 3 minutes each side, then rest.","Fry the mushrooms in the same pan for 4 minutes with the stock cube.","Serve the steak and mushrooms on the mash."];
METHODS["Salmon fish cakes (air fryer)"]=["Boil the potatoes for 12 minutes, then mash.","Mix in the flaked cooked salmon, egg, dill and lemon zest.","Shape into cakes, coat in breadcrumbs, and air-fry at 200C for 12 minutes.","Serve with lemon wedges."];
METHODS["Chicken nuggets and chips"]=["Heat the air fryer to 200C.","Put the frozen chips in the basket in a single layer and cook for 15 to 18 minutes, shaking halfway.","Add the nuggets on top of the chips, or in a separate basket, and cook for 10 to 12 minutes until piping hot all the way through.","Check the nuggets are steaming in the middle, then serve."];
METHODS["Chicken and leek mash bowl"]=["Boil the potatoes for 12 minutes, then mash with butter and milk.","Fry the chicken for 6 minutes, then add the sliced leeks for 4 minutes.","Stir in the stock and cream and simmer 3 minutes.","Serve the chicken over the mash."];
METHODS["Chicken brioche burgers"]=["Season and shape the chicken mince into patties.","Fry the patties for 5 minutes each side until cooked through.","Toast the brioche buns in the pan for 1 minute.","Build with mayonnaise, lettuce, tomato and cheese."];
METHODS["Pork and apple brioche burgers"]=["Mix the pork mince with grated apple and sage, and shape into patties.","Fry the patties for 5 minutes each side until cooked through.","Toast the buns and slice the red onion.","Build with mayonnaise and onion."];
METHODS["Chicken Caesar wraps"]=["Fry the chicken for 6 minutes until cooked, then slice.","Warm the tortillas in a dry pan for 30 seconds each.","Add shredded lettuce, Caesar dressing, chicken and parmesan.","Roll up tightly and cut in half."];
METHODS["Steak and pepper fajita wraps"]=["Toss the sliced steak in fajita seasoning and fry for 3 minutes, then set aside.","Fry the peppers and onion for 5 minutes.","Warm the tortillas and spread with soured cream.","Fill with steak and vegetables and roll up."];
METHODS["Cajun prawn baguettes"]=["Toss the prawns in Cajun spice and flour.","Fry the prawns for 2 to 3 minutes until pink.","Split the baguettes and spread with mayonnaise.","Fill with lettuce and prawns."];
METHODS["Ham and cheese toasties"]=["Spread the bread with butter and mustard.","Layer ham and cheddar between two slices.","Fry in a dry pan for 3 minutes each side until golden and melted.","Cut in half and serve."];
METHODS["Chorizo and egg ciabatta"]=["Fry the sliced chorizo for 3 minutes until its oil releases.","Beat the eggs and cook in the pan with the chorizo for 2 minutes.","Split the ciabatta and layer on the mozzarella and egg.","Air-fry at 180C for 4 minutes until warm, then add basil."];
METHODS["Chicken schnitzel burgers"]=["Flatten the chicken and coat in flour, egg and panko.","Fry 4 minutes each side until golden and cooked.","Toast the brioche buns.","Build with coleslaw, mayonnaise and the schnitzel."];
METHODS["Tuna melts"]=["Mix the drained tuna with mayonnaise and sweetcorn.","Spread the mixture on a slice of bread and top with cheddar.","Cover with a second slice and fry 3 minutes each side until golden.","Cut in half and serve."];
METHODS["Lamb kofta pittas"]=["Mix the lamb mince with cumin and seasoning, and shape into sausages.","Fry the kofta for 8 minutes, turning, until cooked.","Warm the pittas for 1 minute.","Fill with the kofta, yoghurt, cucumber and mint."];
METHODS["Steak sandwiches"]=["Fry the mushrooms and red onion for 6 minutes.","Sear the steak 2 to 3 minutes each side, then rest and slice.","Toast the ciabatta and spread with mustard.","Fill with steak, onion, mushrooms and rocket."];
METHODS["Sausage rolls (air fryer)"]=["Cut the pastry in half lengthways.","Remove the sausage meat from the skins, spread along the pastry and roll up.","Cut into pieces, brush with beaten egg and air-fry at 180C for 12 minutes.","Serve warm with mustard."];
METHODS["Chicken quesadillas"]=["Fry the chicken for 6 minutes, then shred.","Fry the peppers for 3 minutes.","Layer the tortilla with chicken, peppers and cheddar, then fold.","Fry 2 minutes each side until golden and melted. Serve with salsa."];
METHODS["Ham and cheese panini (air fryer)"]=["Split the ciabatta and layer ham, mozzarella and tomato.","Brush the outside with oil.","Air-fry at 180C for 5 minutes until golden and melted.","Add basil and serve."];
METHODS["Beef meatball subs"]=["Mix the beef mince with breadcrumbs and egg and roll into balls.","Fry the meatballs for 8 minutes until cooked.","Warm the passata and add the meatballs for 5 minutes.","Fill the rolls with meatballs and mozzarella, and melt under the grill or in the air fryer for 3 minutes."];

const FIXED_NAMES=["Chicken nuggets and chips","Pizza night"];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateWeek(){
  S.bought={};
  const cooked=DAYS.filter(d=>S.plan[d]&&S.plan[d].cooked);
  const open=DAYS.filter(d=>!(S.plan[d]&&S.plan[d].cooked)&&d!=="Fri"&&d!=="Sat");
  const used=new Set(cooked.map(d=>S.plan[d].recipeId));
  const carbs={};
  cooked.forEach(d=>{const r=S.recipes.find(x=>x.id===S.plan[d].recipeId); if(r) carbs[r.carb]=(carbs[r.carb]||0)+1;});
  const cutoff=new Date(Date.now()-21*864e5).toISOString().slice(0,10);
  const recent=new Set((S.history||[]).filter(h=>h.date>=cutoff).map(h=>h.recipeId));
  const basePool=S.recipes.filter(r=>!used.has(r.id)&&r.carb!=="Bread"&&!FIXED_NAMES.includes(r.name)&&!(r.ingredients||[]).some(i=>/leek|\bham\b|pak choi/i.test(i.name)));
  const freshPool=basePool.filter(r=>!recent.has(r.id));
  const pool=shuffle(freshPool.length>=open.length?freshPool:basePool);
  if(!pool.length){ note("Add some recipes first."); return; }
  let filled=0;
  open.forEach(d=>{
    const pick=pool.find(r=>!used.has(r.id)&&(carbs[r.carb]||0)<2)||pool.find(r=>!used.has(r.id));
    if(!pick){ delete S.plan[d]; return; }
    used.add(pick.id); carbs[pick.carb]=(carbs[pick.carb]||0)+1;
    S.plan[d]={recipeId:pick.id,cooked:false}; filled++;
  });
  [["Fri","Chicken nuggets and chips"],["Sat","Pizza night"]].forEach(([d,name])=>{
    const r=S.recipes.find(x=>norm(x.name)===norm(name));
    if(!r||(S.plan[d]&&S.plan[d].cooked)) return;
    S.plan[d]={recipeId:r.id,cooked:false}; filled++;
  });
  note(`Generated ${filled} dinner${filled===1?'':'s'}. Cooked days were left alone.`);
}
const FULL_DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function loadJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>(window.jspdf&&window.jspdf.jsPDF)?resolve(window.jspdf.jsPDF):reject(new Error("PDF library did not load"));
    s.onerror=()=>reject(new Error("PDF library could not be reached"));
    document.head.appendChild(s);
  });
}

  if(!days.length){ note("Plan some dinners before confirming the week."); return; }

function stepKind(s){
  const t=s.toLowerCase();
  if(/air.?fry|oven|basket/.test(t)) return "basket";
  if(/drain/.test(t)) return "colander";
  if(/serve|top |topping|build|fill|sprinkle|scatter|garnish/.test(t)) return "plate";
  if(/rest|cool|set |leave/.test(t)) return "clock";
  if(/boil|simmer|water/.test(t)) return "pot";
  if(/chop|slice|cut|dice|snip|shred|halve|flake|break/.test(t)) return "knife";
  if(/mix|toss|stir|whisk|beat|combine|coat|mash|rub|season|dip/.test(t)) return "bowl";
  if(/fry|sear|brown|wilt|crisp|scramble|golden|cook/.test(t)) return "pan";
  return "spoon";
}

const PRICES={};
PRICES_RAW.forEach(s=>{const [n,p,u,lo,hi]=s.split("|"); PRICES[n]={pack:+p,unit:u,low:+lo,high:+hi};});
const normU=u=>String(u||"").toLowerCase().trim().replace(/s$/,"");
const normN=n=>String(n||"").toLowerCase().trim().replace(/\s+/g," ");
function bandFor(name,need,unit){
  const ak=normN(name)+"|"+normU(unit), act=S.actual&&S.actual[ak];
  if(act){ const cv={tbsp:15,tsp:5}[normU(unit)]||1; const packs=Math.max(1,Math.ceil(need*cv/act.pack)); return {packs,pack:act.pack,unitName:act.unitName,low:packs*act.price,high:packs*act.price,mine:true}; }
  const nm=normN(name), nu=normU(unit);
  const full=PRICES[nm+" "+nu];
  if(full){ const packs=Math.max(1,Math.ceil(need/full.pack)); return {packs,pack:full.pack,unitName:full.unit,low:packs*full.low,high:packs*full.high}; }
  let q=need, u=nu;
  if(String(unit||"").trim().startsWith("(")||nu==="clove") u="each";
  const conv={tbsp:15,tsp:5};
  if(conv[nu]){ q=need*conv[nu]; u="ml"; }
  const p=PRICES[nm]||PRICES[nm.replace(/es$/,"")]||PRICES[nm.replace(/s$/,"")];
  if(!p||normU(p.unit)!==u) return null;
  const packs=Math.max(1,Math.ceil(q/p.pack));
  return {packs,pack:p.pack,unitName:p.unit,low:packs*p.low,high:packs*p.high};
}
function costCell(x){
  const b=bandFor(x.name,x.buy,x.unit);
  if(!b) return '<span class="muted">pantry or not priced</span>';
  return `${gbp(b.low)} to ${gbp(b.high)}<div class="note">${b.packs} × ${b.pack} ${esc(b.unitName)} pack</div>`;
}
function totalBand(list){
  let lo=0, hi=0, n=0;
  list.forEach(x=>{ const b=bandFor(x.name,x.buy,x.unit); if(b){ lo+=b.low; hi+=b.high; n++; } });
  return `${gbp(lo)} to ${gbp(hi)} (${n} of ${list.length} items priced)`;
}
const V={stock:vStock,house:vHouse,recipes:vRecipes,plan:vPlan,shop:vShop,budget:vBudget};

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.getElementById("view").innerHTML=V[tab]();
  paintStatus();
}
function paintStatus(){ document.getElementById("status").textContent=status; }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-a]");
  if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; render(); return; }
  const a=t.dataset.a, id=t.dataset.id;
  switch(a){
    case "stock-inc":
    case "stock-dec": {
      const s=S.stock.find(x=>x.id===id);
      if(s){ const st=stepFor(s.unit); s.qty=Math.max(0,+(s.qty+(a==="stock-inc"?st:-st)).toFixed(2)); }
      break;
    }
    case "stock-del": S.stock=S.stock.filter(x=>x.id!==id); break;
    case "stock-add": {
      const name=val("sn").trim();
      if(!name){ note("Give the stock item a name."); return; }
      S.stock.push({id:uid0(),name,qty:+val("sq")||0,unit:val("su").trim()||"each",low:+val("sl")||0});
      break;
    }
    case "house-add": {
      const name=val("hn").trim();
      if(!name){ note("Give the item a name."); return; }
      S.stock.push({id:uid0(),name,unit:val("hu").trim()||"each",qty:+val("hq")||0,low:+val("hl")||0,cat:val("hc")||"Household",need:+val("hw")||0});
      break;
    }
    case "rec-add": {
      const name=val("rn").trim();
      if(!name){ note("Give the recipe a name."); return; }
      const ingredients=val("ri").split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(p=>p[0])
        .map(p=>({name:p[0],qty:parseFloat(p[1])||0,unit:p[2]||"each"}));
      S.recipes.push({id:uid0(),name,servings:Math.max(1,+val("rs")||1),cost:+val("rc")||0,
        prep:+val("rp")||0,cook:+val("rk")||0,ingredients});
      break;
    }
    case "rec-del": {
      S.recipes=S.recipes.filter(x=>x.id!==id);
      Object.keys(S.plan).forEach(d=>{ if(S.plan[d]&&S.plan[d].recipeId===id) delete S.plan[d]; });
      break;
    }
    case "plan-cook": cook(t.dataset.day); break;
    case "rec-starter": {
      let added=0;
      STARTER.forEach(x=>{
        if(!S.recipes.some(r=>norm(r.name)===norm(x.name))){
          S.recipes.push({...x,id:uid0(),ingredients:x.ingredients.map(i=>({...i}))}); added++;
        }
      });
      note(added?`Added ${added} starter recipe${added===1?'':'s'}.`:"Starter recipes are already in your library.");
      break;
    }
    case "plan-generate": generateWeek(); break;
    case "plan-confirm": confirmWeek(); break;
    case "plan-clear": S.plan={}; break;
    case "shop-all": {
      S.bought=S.bought||{}; S.boughtMeta=S.boughtMeta||{}; S.stock=S.stock||[];
      shopping().forEach(x=>{
        const dk=normN(x.name)+"|"+normU(x.unit);
        if(S.bought[dk]) return;
        S.bought[dk]=true; S.boughtMeta[dk]={name:x.name,unit:x.unit};
        const s=S.stock.find(y=>norm(y.name)===norm(x.name)&&norm(y.unit)===norm(x.unit));
        if(s) s.qty+=x.buy; else S.stock.push({id:uid0(),name:x.name,unit:x.unit,qty:x.buy,low:0});
      });
      break;
    }
    case "shop-bought": {
      S.bought=S.bought||{}; S.bought[t.dataset.key]=true; S.boughtMeta=S.boughtMeta||{}; S.boughtMeta[t.dataset.key]={name:t.dataset.name,unit:t.dataset.unit};
      const name=t.dataset.name, unit=t.dataset.unit, q=+t.dataset.buy||0;
      const s=S.stock.find(x=>norm(x.name)===norm(name)&&norm(x.unit)===norm(unit));
      if(s) s.qty+=q; else S.stock.push({id:uid0(),name,unit,qty:q,low:0});
      break;
    }
    default: return;
  }
  save(); render();
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sn"){ const o=[...document.querySelectorAll("#ingr option")].find(x=>x.value===t.value); if(o&&o.dataset.unit) document.getElementById("su").value=o.dataset.unit; return; }
  if(t.dataset.a==="actual"){
    if(!S.actual) S.actual={};
    const ak=normN(t.dataset.name)+"|"+normU(t.dataset.unit);
    const b=bandFor(t.dataset.name,+t.dataset.buy,t.dataset.unit);
    if(!b){ note("No pack size for that item, so it can't be learned."); return; }
    const paid=+t.value;
    if(!paid){ delete S.actual[ak]; } else { S.actual[ak]={pack:b.pack,unitName:b.unitName,price:paid/b.packs}; }
    save(); render(); return;
  }
  if(t.dataset.a==="plan-set"){
    const d=t.dataset.day;
    if(t.value) S.plan[d]={recipeId:t.value,cooked:false}; else delete S.plan[d];
    save(); render(); return;
  }
  if(t.dataset.f){
    const [sec,k]=t.dataset.f.split(".");
    if(k===undefined) S[sec]=+t.value||0; else S[sec][k]=+t.value||0;
    save(); render();
  }
});
